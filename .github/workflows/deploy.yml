name: Deploy to dokani.vexasoft.net

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/dokani.vexasoft.net
            git fetch origin master
            git reset --hard origin/master
            php8.5 /usr/local/bin/composer install --no-dev --optimize-autoloader
            npm ci
            npm run build
            php8.5 artisan migrate --force
            php8.5 artisan config:cache
            php8.5 artisan route:cache
            php8.5 artisan view:cache
            chown -R www-data:www-data storage bootstrap/cache
            systemctl restart php8.5-fpm
